<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" viewBox="0 0 760 324" width="760" height="324" role="img" aria-label="A Node CRUD API installs up to 20 times the packages of a Python one" font-size="12"><text x="24" y="28" font-size="16" font-weight="600" fill="#1f1e1d">A Node CRUD API installs up to 20 times the packages of a Python one</text><text x="24" y="50" fill="#5f5e5a">Approximate package counts from small sample CRUD apps, runtime only, each with a Postgres driver</text><g><g><text x="24" y="99" fill="#1f1e1d">NestJS + TypeORM</text><rect x="210" y="84" width="470" height="22" rx="3" fill="#2d7be0"><title>NestJS + TypeORM (Node): 139 packages</title></rect><text x="688" y="99" fill="#1f1e1d">139</text></g><g><text x="24" y="139" fill="#1f1e1d">Express + middleware</text><rect x="210" y="124" width="327.9856115107914" height="22" rx="3" fill="#2d7be0"><title>Express + middleware (Node): 97 packages</title></rect><text x="545.9856115107914" y="139" fill="#1f1e1d">97</text></g><g><text x="24" y="179" fill="#1f1e1d">FastAPI</text><rect x="210" y="164" width="71.00719424460432" height="22" rx="3" fill="#c4c3b6"><title>FastAPI (Python): 21 packages</title></rect><text x="289.0071942446043" y="179" fill="#1f1e1d">21</text></g><g><text x="24" y="219" fill="#1f1e1d">Flask</text><rect x="210" y="204" width="37.194244604316545" height="22" rx="3" fill="#c4c3b6"><title>Flask (Python): 11 packages</title></rect><text x="255.19424460431654" y="219" fill="#1f1e1d">11</text></g><g><text x="24" y="259" fill="#1f1e1d">Django + DRF</text><rect x="210" y="244" width="23.66906474820144" height="22" rx="3" fill="#c4c3b6"><title>Django + DRF (Python): 7 packages</title></rect><text x="241.66906474820144" y="259" fill="#1f1e1d">7</text></g></g><line x1="210" x2="210" y1="76" y2="290" stroke="#b7b6ab"></line><text x="24" y="312" font-size="11" fill="#5f5e5a">Blue: Node.js stacks. Grey: Python stacks. Counts vary with versions and options; dev tooling adds more.</text></svg>