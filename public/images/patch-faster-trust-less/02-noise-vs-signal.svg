<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" viewBox="0 0 760 376" width="760" height="376" role="img" aria-label="CVEs are up 127% on last year; exploitation is up about 55%" font-size="12"><text x="24" y="28" font-size="16" font-weight="600" fill="#1f1e1d">CVEs are up 127% on last year; exploitation is up about 55%</text><text x="24" y="50" fill="#5f5e5a">January to October of each year</text><text x="40" y="78" font-weight="600" fill="#1f1e1d">CVEs published</text><g><rect x="40" y="231.40" width="44" height="68.60" fill="#c4c3b6"><title>2024: 32,437 CVEs published, January to October</title></rect><text x="62" y="225.40" text-anchor="middle" fill="#1f1e1d">32,437</text><text x="62" y="318" text-anchor="middle" fill="#5f5e5a">2024</text></g><g><rect x="108" y="216.17" width="44" height="83.83" fill="#c4c3b6"><title>2025: 39,638 CVEs published, January to October</title></rect><text x="130" y="210.17" text-anchor="middle" fill="#1f1e1d">39,638</text><text x="130" y="318" text-anchor="middle" fill="#5f5e5a">2025</text></g><g><rect x="176" y="110.00" width="44" height="190.00" fill="#2d7be0"><title>2026: 89,844 CVEs published, January to October</title></rect><text x="198" y="104.00" text-anchor="middle" fill="#1f1e1d">89,844</text><text x="198" y="318" text-anchor="middle" fill="#5f5e5a">2026</text></g><line x1="40" x2="220" y1="300" y2="300" stroke="#b7b6ab"></line><text x="290" y="78" font-weight="600" fill="#1f1e1d">Known exploited vulnerabilities</text><g><rect x="290" y="213.56" width="44" height="86.44" fill="#c4c3b6"><title>2024: 794 known exploited vulnerabilities added to VulnCheck KEV, January to October</title></rect><text x="312" y="207.56" text-anchor="middle" fill="#1f1e1d">794</text><text x="312" y="318" text-anchor="middle" fill="#5f5e5a">2024</text></g><g><rect x="358" y="216.17" width="44" height="83.83" fill="#c4c3b6"><title>2025: 770 known exploited vulnerabilities added to VulnCheck KEV, January to October</title></rect><text x="380" y="210.17" text-anchor="middle" fill="#1f1e1d">770</text><text x="380" y="318" text-anchor="middle" fill="#5f5e5a">2025</text></g><g><rect x="426" y="168.82" width="44" height="131.18" fill="#2d7be0"><title>2026: 1,205 known exploited vulnerabilities added to VulnCheck KEV, January to October</title></rect><text x="448" y="162.82" text-anchor="middle" fill="#1f1e1d">1,205</text><text x="448" y="318" text-anchor="middle" fill="#5f5e5a">2026</text></g><line x1="290" x2="470" y1="300" y2="300" stroke="#b7b6ab"></line><text x="540" y="78" font-weight="600" fill="#1f1e1d">Exploited within a month</text><g><rect x="540" y="213.44" width="44" height="86.56" fill="#c4c3b6"><title>2024: 317 CVEs published January 1 to October 14 and known exploited within 31 days</title></rect><text x="562" y="207.44" text-anchor="middle" fill="#1f1e1d">317</text><text x="562" y="318" text-anchor="middle" fill="#5f5e5a">2024</text></g><g><rect x="608" y="216.17" width="44" height="83.83" fill="#c4c3b6"><title>2025: 307 CVEs published January 1 to October 14 and known exploited within 31 days</title></rect><text x="630" y="210.17" text-anchor="middle" fill="#1f1e1d">307</text><text x="630" y="318" text-anchor="middle" fill="#5f5e5a">2025</text></g><g><rect x="676" y="170.30" width="44" height="129.70" fill="#2d7be0"><title>2026: 475 CVEs published January 1 to October 14 and known exploited within 31 days</title></rect><text x="698" y="164.30" text-anchor="middle" fill="#1f1e1d">475</text><text x="698" y="318" text-anchor="middle" fill="#5f5e5a">2026</text></g><line x1="540" x2="720" y1="300" y2="300" stroke="#b7b6ab"></line><text x="24" y="346" font-size="11" fill="#5f5e5a">Each panel is scaled so its 2025 bar is the same height, making growth directly comparable.</text><text x="24" y="362" font-size="11" fill="#5f5e5a">The within-a-month panel covers CVEs published January 1 to October 14, so each has had a full month.</text></svg>
