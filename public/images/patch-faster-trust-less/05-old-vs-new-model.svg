<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" viewBox="0 0 760 324" width="760" height="324" role="img" aria-label="Deadlines now follow risk, not severity" font-size="13"><defs><marker id="model-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b7b6ab"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">Deadlines now follow risk, not severity</text><text x="24" y="70" font-size="11.5" font-weight="600" fill="#5f5e5a">Before: severity and fixed clocks</text><text x="406" y="70" font-size="11.5" font-weight="600" fill="#5f5e5a">After: BOD 26-04 and FedRAMP VDR/VER</text><g><line x1="189" y1="140" x2="189" y2="164" stroke="#b7b6ab" stroke-width="1.25" marker-end="url(#model-arrow)"></line><line x1="189" y1="220" x2="189" y2="244" stroke="#b7b6ab" stroke-width="1.25" marker-end="url(#model-arrow)"></line><line x1="571" y1="140" x2="571" y2="164" stroke="#b7b6ab" stroke-width="1.25" marker-end="url(#model-arrow)"></line><line x1="571" y1="220" x2="571" y2="244" stroke="#b7b6ab" stroke-width="1.25" marker-end="url(#model-arrow)"></line></g><g><rect x="24" y="84" width="330" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b7b6ab" stroke-width="1.25"></rect><text x="40" y="108" font-weight="600" fill="#1f1e1d">Score: CVSS severity</text><text x="40" y="126" font-size="11.5" fill="#5f5e5a">Critical, high, medium, low</text></g><g><rect x="24" y="164" width="330" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b7b6ab" stroke-width="1.25"></rect><text x="40" y="188" font-weight="600" fill="#1f1e1d">Clock: fixed by severity</text><text x="40" y="206" font-size="11.5" fill="#5f5e5a">15 days critical, 30 days high if internet-facing</text></g><g><rect x="24" y="244" width="330" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b7b6ab" stroke-width="1.25"></rect><text x="40" y="268" font-weight="600" fill="#1f1e1d">Result: patch everything</text><text x="40" y="286" font-size="11.5" fill="#5f5e5a">No formal way to defer low-risk findings</text></g><g><rect x="406" y="84" width="330" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b7b6ab" stroke-width="1.25"></rect><text x="422" y="108" font-weight="600" fill="#1f1e1d">Score: four questions</text><text x="422" y="126" font-size="11.5" fill="#5f5e5a">Exposed? Known exploited? Automatable? Impact?</text></g><g><rect x="406" y="164" width="330" height="56" rx="8" fill="#2d7be0" fill-opacity="0.12" stroke="#2d7be0" stroke-width="2"></rect><text x="422" y="188" font-weight="600" fill="#1f1e1d">Clock: set by risk</text><text x="422" y="206" font-size="11.5" fill="#1f1e1d">3 days at worst, fix on next upgrade at best</text></g><g><rect x="406" y="244" width="330" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b7b6ab" stroke-width="1.25"></rect><text x="422" y="268" font-weight="600" fill="#1f1e1d">Result: mitigate or remediate</text><text x="422" y="286" font-size="11.5" fill="#5f5e5a">Cutting exposure counts and pushes the clock back</text></g></svg>