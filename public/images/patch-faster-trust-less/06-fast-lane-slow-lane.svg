<svg xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" viewBox="0 0 760 282" width="760" height="282" role="img" aria-label="Real signal gets a fast lane; everything else waits and gets reviewed" font-size="13"><defs><marker id="lane-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b7b6ab"></path></marker></defs><text x="24" y="34" font-size="15" font-weight="600" fill="#1f1e1d">Real signal gets a fast lane; everything else waits and gets reviewed</text><text x="212" y="72" font-size="11.5" font-weight="600" fill="#5f5e5a">Fast lane: exploited, exposed or automatable</text><text x="212" y="192" font-size="11.5" font-weight="600" fill="#5f5e5a">Slow lane: everything else</text><g fill="none" stroke="#b7b6ab" stroke-width="1.25"><path d="M174 170H193V110H212" marker-end="url(#lane-arrow)"></path><path d="M174 170H193V230H212" marker-end="url(#lane-arrow)"></path><path d="M372 110H392" marker-end="url(#lane-arrow)"></path><path d="M552 110H572" marker-end="url(#lane-arrow)"></path><path d="M372 230H392" marker-end="url(#lane-arrow)"></path><path d="M552 230H572" marker-end="url(#lane-arrow)"></path></g><g><rect x="24" y="142" width="150" height="56" rx="8" fill="none" stroke="#b7b6ab" stroke-width="1.25"></rect><text x="99" y="166" text-anchor="middle" font-weight="600" fill="#1f1e1d">Finding or update</text><text x="99" y="184" text-anchor="middle" font-size="11.5" fill="#5f5e5a">Triage by risk</text></g><g><rect x="212" y="82" width="160" height="56" rx="8" fill="#2d7be0" fill-opacity="0.12" stroke="#2d7be0" stroke-width="2"></rect><text x="292" y="106" text-anchor="middle" font-weight="600" fill="#1f1e1d">Mitigate now</text><text x="292" y="124" text-anchor="middle" font-size="11.5" fill="#1f1e1d">WAF rule or isolate</text></g><g><rect x="392" y="82" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b7b6ab" stroke-width="1.25"></rect><text x="472" y="106" text-anchor="middle" font-weight="600" fill="#1f1e1d">Patch</text><text x="472" y="124" text-anchor="middle" font-size="11.5" fill="#5f5e5a">through the pipeline</text></g><g><rect x="572" y="82" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b7b6ab" stroke-width="1.25"></rect><text x="652" y="106" text-anchor="middle" font-weight="600" fill="#1f1e1d">Remove mitigation</text><text x="652" y="124" text-anchor="middle" font-size="11.5" fill="#5f5e5a">once fix verified</text></g><g><rect x="212" y="202" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b7b6ab" stroke-width="1.25"></rect><text x="292" y="226" text-anchor="middle" font-weight="600" fill="#1f1e1d">Cooldown</text><text x="292" y="244" text-anchor="middle" font-size="11.5" fill="#5f5e5a">24 hours or more</text></g><g><rect x="392" y="202" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b7b6ab" stroke-width="1.25"></rect><text x="472" y="226" text-anchor="middle" font-weight="600" fill="#1f1e1d">Review the diff</text><text x="472" y="244" text-anchor="middle" font-size="11.5" fill="#5f5e5a">AI first, human signs</text></g><g><rect x="572" y="202" width="160" height="56" rx="8" fill="none" fill-opacity="1" stroke="#b7b6ab" stroke-width="1.25"></rect><text x="652" y="226" text-anchor="middle" font-weight="600" fill="#1f1e1d">Adopt</text><text x="652" y="244" text-anchor="middle" font-size="11.5" fill="#5f5e5a">next scheduled build</text></g></svg>